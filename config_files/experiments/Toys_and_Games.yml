experiment:
  backend: [pytorch]
  data_config:
    strategy: fixed
    train_path: ../data/{0}/toys_and_games_Train_final.tsv
    validation_path: ../data/{0}/toys_and_games_Val_final.tsv
    test_path: ../data/{0}/toys_and_games_Test_final.tsv
    side_information:
      - dataloader: InteractionsTextualAttributes
        interactions_features: ../data/{0}/1/
        interactions: ../data/{0}/toys_and_games_interactions.tsv
  dataset: Toys_and_Games
  top_k: 20
  evaluation:
    cutoffs: [20]
    simple_metrics: [Recall, MSE, AUC]
  gpu: 0
  external_models_path: ../external/models/__init__.py
  models:
    external.RoGER:
      meta:
        hyper_max_evals: 150
        hyper_opt_alg: tpe
        verbose: True
        save_weights: False
        save_recs: False
        validation_rate: 1
        validation_metric: MSE
        restore: False
      epochs: 50
      batch_size: 128
      n_layers: 3
      emb: 16
      lr: [qloguniform, -9.2, -4.6, 1e-3]
      seed: 123
      lambda: [quniform, 0.0, 1.0, 1e-1]
      drop: 0.5
      dense: (32,16,8)
      aggr: [choice, [nn, att, sim]]
      alpha: [quniform, 0.01, 0.5, 0.01]
      factor: 0.1
      patience: 2
      nd: 0.1
      weight_decay: [qloguniform, -13.8, -4.6, 1e-5]
