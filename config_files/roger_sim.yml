experiment:
  backend: [pytorch]
  data_config:
    strategy: fixed
    train_path: ../data/{0}/train_final_indexed.tsv
    validation_path: ../data/{0}/val_final_indexed.tsv
    test_path: ../data/{0}/test_final_indexed.tsv
    side_information:
      - dataloader: InteractionsTextualAttributes
        interactions_features: ../data/{0}/finale/
        interactions: ../data/{0}/interactions.tsv
  dataset: amazon_office
  top_k: 20
  evaluation:
    cutoffs: [20]
    simple_metrics: [Recall, MSE]
  gpu: 0
  external_models_path: ../external/models/__init__.py
  models:
    external.RoGER:
      meta:
        hyper_opt_alg: grid
        verbose: True
        save_weights: False
        save_recs: False
        validation_rate: 1
        validation_metric: MSE
        restore: False
      epochs: 50
      batch_size: 128
      n_layers: 3
      emb: 16
      lr: [0.0001, 0.0005, 0.001, 0.005, 0.01]
      seed: 123
      lambda: 0.3
      drop: 0.5
      dense: (32,16,8)
      aggr: sim